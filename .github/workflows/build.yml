# Every push to main builds the IPA on Codemagic (macOS M2, codemagic.yaml) and publishes it as a GitHub release of that commit
# (tag v<version>-build.<run number>). Same pipeline as partikel-capture, but the thin polling job runs on GitHub's Linux runner
# (personal repo, free minutes); the Mac work happens on Codemagic. Needs the repository secret CODEMAGIC_TOKEN and the repo added
# as an app in Codemagic.
name: Watch build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build on Codemagic, publish the IPA
        env:
          GH_TOKEN: ${{ github.token }}
          CODEMAGIC_TOKEN: ${{ secrets.CODEMAGIC_TOKEN }}
        run: python3 tools/codemagic_build.py --branch "$GITHUB_REF_NAME"
