# Fallback Mac build on a GitHub-hosted macOS runner (counts 10x against the free Actions minutes; one build is ~5 runner minutes).
# Started by pushing a tag `mac-build-*`; publishes the unsigned IPA as a pre-release of that tag. The usual path is Codemagic (build.yml).
name: Mac build (GitHub-hosted)
on:
  push:
    tags: ['mac-build-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and SDKs
        run: python3 tools/build.py --check
      - name: Build iPhone host + watch app, package IPA
        run: python3 tools/build.py
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa=$(ls build/*/TiltFace-unsigned.ipa | head -1)
          report=$(dirname "$ipa")/build-report.json
          cp "$ipa" "TiltFace-${GITHUB_REF_NAME}-${GITHUB_SHA::7}-unsigned.ipa"
          gh release create "$GITHUB_REF_NAME" "TiltFace-${GITHUB_REF_NAME}-${GITHUB_SHA::7}-unsigned.ipa" "$report" \
            --prerelease --title "TiltFace ${GITHUB_REF_NAME}" \
            --notes "Unsigned: sign and install with Sideloadly on the iPhone paired with the watch. Built on GitHub's macOS runner from ${GITHUB_SHA::7}."
