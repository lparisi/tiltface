# Fallback Mac build on a GitHub-hosted macOS runner (counts 10x against the free Actions minutes; one build is ~5 runner minutes).
# Started by pushing the branch `mac-build`; publishes the unsigned IPA as a pre-release tagged mac-build-<run number>. The usual path is Codemagic (build.yml).
name: Mac build (GitHub-hosted)
on:
  push:
    branches: [mac-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and SDKs
        run: python3 tools/build.py --check
      - name: Build iPhone host + watch app, package IPA
        run: python3 tools/build.py
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa=$(ls build/*/TiltFace-unsigned.ipa | head -1)
          report=$(dirname "$ipa")/build-report.json
          tag="mac-build-${GITHUB_RUN_NUMBER}"
          cp "$ipa" "TiltFace-${tag}-${GITHUB_SHA::7}-unsigned.ipa"
          gh release create "$tag" "TiltFace-${tag}-${GITHUB_SHA::7}-unsigned.ipa" "$report" \
            --target "$GITHUB_SHA" --prerelease --title "TiltFace ${tag}" \
            --notes "Unsigned: sign and install with Sideloadly on the iPhone paired with the watch. Built on GitHub's macOS runner from ${GITHUB_SHA::7}."
