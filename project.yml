name: TiltFace
options:
  bundleIdPrefix: digital.svrn
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  # iPhone host: carries the watch app inside TiltFace.app/Watch so it can be sideloaded through the iPhone.
  TiltFace:
    type: application
    platform: iOS
    sources: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.svrn.tiltface
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TiltFace
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: TiltFaceWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme:
      testTargets: []

  # The watch app itself (single-target SwiftUI watchOS app).
  TiltFaceWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ["Dial/*.fsh"]
      # SpriteKit loads the fragment shader source at run time (SKShader(fileNamed:)), so ship it as a resource.
      - path: Watch/Dial/WorldDial.fsh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.svrn.tiltface.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WatchInfo.plist
        INFOPLIST_KEY_CFBundleDisplayName: TiltFace
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
